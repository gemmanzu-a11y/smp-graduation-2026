<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전력예보 · 발표자 화면</title><link rel="stylesheet" href="style.css"><body class="presenter-body"><div class="presenter-grid"><main><div id="timer">00:00</div><h1 id="current-title">본편 연결 대기</h1><iframe id="current-frame" title="현재 슬라이드 미리보기"></iframe><div id="note" aria-live="polite"></div><button id="previous">← 이전</button><button id="forward">다음 →</button><button id="reset">타이머 초기화</button></main><aside><h1>다음 장 미리보기</h1><iframe id="next-frame" title="다음 장 미리보기"></iframe><p id="up-next"></p><p id="connection"></p><a href="index.html" target="_blank">본편 열기</a></aside></div><script src="slides.js"></script><script>
const bc=new BroadcastChannel('power-forecast-deck-v1');let start=null;let key='';
bc.onmessage=e=>{const m=e.data;if(m.type!=='state')return;start=m.started;const k=m.slide+'.'+m.step;document.querySelector('#connection').textContent='본편 연결됨 · BroadcastChannel';if(k===key)return;key=k;const s=SLIDES[m.slide-1];document.querySelector('#current-title').textContent=`${m.slide}장 · ${m.step}/${s.notes.length}단계 · ${s.title.replaceAll('\n',' ')}`;document.querySelector('#note').textContent=s.notes[m.step-1];document.querySelector('#current-frame').src='index.html?preview#'+k;const next=Math.min(17,m.slide+1);document.querySelector('#next-frame').src='index.html?preview#'+next+'.1';document.querySelector('#up-next').textContent=m.slide===17?'본편 끝 · 필요 시 기술 부록':'다음: '+SLIDES[next-1].title.replaceAll('\n',' ');};
bc.postMessage({type:'request'});setInterval(()=>{if(start){const s=Math.floor((Date.now()-start)/1000);document.querySelector('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},500);
function send(action){bc.postMessage({type:'command',action})}document.querySelector('#previous').onclick=()=>send('prev');document.querySelector('#forward').onclick=()=>send('next');document.querySelector('#reset').onclick=()=>send('reset-timer');document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input'))return;if(['ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();send('next')}if(['ArrowLeft','Backspace'].includes(e.key)){e.preventDefault();send('prev')}});
</script></body></html>
